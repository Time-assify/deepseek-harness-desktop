<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'" />
  <title>插件商店</title>
  <link rel="stylesheet" href="common.css" />
  <style>
    body {
      display: flex;
      flex-direction: column;
      height: 100vh;
      padding: 20px 24px;
    }
    h1 {
      font-size: 18px;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }
    h1 .mark {
      width: 30px; height: 30px; border-radius: 9px;
      background: var(--grad); color: #fff;
      display: grid; place-items: center;
      font-size: 12px; font-weight: 800;
      box-shadow: 0 3px 12px var(--accent-glow);
    }
    .search-row { display: flex; gap: 8px; margin-bottom: 14px; }
    .search-row input { flex: 1; font-family: inherit; }
    .columns { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; flex: 1; min-height: 0; }
    .panel {
      display: flex; flex-direction: column; min-height: 0; overflow: hidden;
    }
    .panel h2 {
      font-size: 12.5px; padding: 12px 18px;
      border-bottom: 1px solid var(--border);
      color: var(--text-2); font-weight: 650;
      display: flex; align-items: center; gap: 8px;
    }
    .panel h2 .count {
      margin-left: auto;
      font-size: 11px; color: var(--text-3); font-weight: 400;
    }
    .list { flex: 1; overflow: auto; padding: 8px; }
    .item {
      padding: 13px 14px;
      border-radius: 11px;
      transition: background 0.15s ease;
      margin-bottom: 2px;
    }
    .item:hover { background: var(--surface-2); }
    .item .name {
      font-weight: 650; font-size: 13px; font-family: var(--mono);
      user-select: text; display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    }
    .item .desc {
      color: var(--text-2); font-size: 12px; margin: 5px 0 9px;
      line-height: 1.55; user-select: text;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .item .meta { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .tag {
      font-size: 10.5px; color: var(--accent);
      background: var(--accent-soft); border-radius: 5px; padding: 1px 7px;
      font-family: var(--mono);
    }
    .spacer { flex: 1; }
    .item button { padding: 4px 12px; font-size: 12px; }
    .skeleton {
      height: 84px; border-radius: 11px; margin-bottom: 6px;
      background: linear-gradient(90deg, var(--surface-2) 25%, var(--border) 50%, var(--surface-2) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.2s infinite;
    }
    @keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }
    .log-panel {
      height: 140px; min-height: 140px; margin-top: 14px;
      display: flex; flex-direction: column; overflow: hidden;
    }
    .log-panel h2 {
      font-size: 12.5px; padding: 10px 18px;
      border-bottom: 1px solid var(--border);
      color: var(--text-2); font-weight: 650;
    }
    .log-console { border-radius: 0; flex: 1; }
    .status { color: var(--text-2); font-size: 12px; padding: 8px 2px 0; }
    .status.error { color: var(--danger); }
    .empty {
      color: var(--text-3); font-size: 12.5px; text-align: center; padding: 30px 12px;
    }
  </style>
</head>
<body>
  <h1><span class="mark">DS</span>插件商店</h1>
  <div class="search-row">
    <input type="text" id="query" placeholder="搜索 dsh 插件（留空展示全部 dsh-plugin 插件）" />
    <button id="searchBtn" class="primary">搜索</button>
  </div>
  <div class="columns">
    <div class="card panel">
      <h2>
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
        市场 <span class="count" id="marketCount"></span>
      </h2>
      <div class="list" id="market"></div>
    </div>
    <div class="card panel">
      <h2>
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
        已安装（web profile）<span class="count" id="installedCount"></span>
      </h2>
      <div class="list" id="installed"></div>
    </div>
  </div>
  <div class="card log-panel">
    <h2>安装日志</h2>
    <div class="log-console" id="log">（暂无）</div>
  </div>
  <div class="status" id="status"></div>
  <script src="plugins.js"></script>
</body>
</html>
