<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'" />
  <title>DeepSeek Harness</title>
  <link rel="stylesheet" href="common.css" />
  <style>
    body {
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 24px;
      flex: none;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      font-weight: 650;
      font-size: 15px;
    }
    .brand .mark {
      width: 30px;
      height: 30px;
      border-radius: 9px;
      background: var(--grad);
      color: #fff;
      display: grid;
      place-items: center;
      font-size: 13px;
      font-weight: 800;
    }
    .brand .ver {
      font-size: 11px;
      color: var(--text-3);
      font-weight: 400;
      border: 1px solid var(--border);
      padding: 1px 8px;
      border-radius: 999px;
      margin-left: 2px;
    }
    .brand .logo-dot {
      display: inline-block;
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--accent);
      margin-left: 6px;
      animation: logoPulse 2s ease-in-out infinite;
    }
    @keyframes logoPulse {
      0%, 100% { opacity: 0.4; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.4); }
    }
    .actions { display: flex; gap: 8px; }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: 24px;
      position: relative;
    }
    .logo-icon {
      width: 68px;
      height: 68px;
      border-radius: 18px;
      background: var(--grad);
      color: #fff;
      display: grid;
      place-items: center;
      font-size: 26px;
      font-weight: 800;
    }
    .status-pill {
      display: flex;
      align-items: center;
      gap: 9px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 9px 20px;
      font-size: 13.5px;
    }
    .pulse {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 0 var(--accent-glow);
      animation: pulse 1.6s ease-out infinite;
      display: inline-block;
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 var(--accent-glow); }
      70% { box-shadow: 0 0 0 9px transparent; }
      100% { box-shadow: 0 0 0 0 transparent; }
    }
    .panel {
      width: min(680px, 92%);
      z-index: 1;
      overflow: hidden;
    }
    .panel .head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 11px 16px;
      border-bottom: 1px solid var(--border);
      font-size: 12px;
      color: var(--text-2);
      font-weight: 600;
    }
    .panel .dots { display: flex; gap: 5px; }
    .panel .dots i {
      width: 9px; height: 9px; border-radius: 50%;
      background: var(--border-strong);
    }
    .log-console {
      border-radius: 0;
      min-height: 180px;
      max-height: 240px;
    }
    .hint { z-index: 1; text-align: center; }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="brand">
      <span class="mark">DS</span>
      DeepSeek Harness
      <span class="ver">v0.1</span>
      <span class="logo-dot"></span>
    </div>
    <div class="actions">
      <button id="plugins">插件商店</button>
      <button id="dashboard">成本仪表盘</button>
      <button id="settings">设置</button>
      <button id="quit" class="primary">退出</button>
    </div>
  </div>
  <main>
    <div class="logo-icon">DS</div>
    <div class="status-pill">
      <span class="pulse" id="pulse"></span>
      <span id="status">正在启动 dsh 服务…</span>
    </div>
    <div class="card panel" id="panel">
      <div class="head">
        <span>dsh 服务日志</span>
        <span class="dots"><i></i><i></i><i></i></span>
      </div>
      <div class="log-console" id="log"></div>
    </div>
    <div class="hint">
      首次启动需要加载全部插件，约需 5–15 秒。<br />
      若长时间无响应，请点击「设置」检查 API Key 后重启服务。
    </div>
  </main>
  <script src="loading.js"></script>
</body>
</html>
