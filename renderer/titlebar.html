<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'" />
  <title>titlebar</title>
  <style>
    :root { --tb-bg: #1a1e28; --tb-text: #aab3c5; --tb-text-strong: #e7eaf2; }
    :root[data-theme="light"] { --tb-bg: #eef0f6; --tb-text: #5a6478; --tb-text-strong: #171d2e; }
    :root[data-theme="light"] { --tb-border: #d4dae6; --tb-btn: #e4e8f1; --tb-btn-hover: #d8deeb; }
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
    html, body {
      height: 100vh;
      overflow: hidden;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    }
    body {
      display: flex;
      align-items: center;
      background: var(--tb-bg);
      color: var(--tb-text);
      font-size: 12.5px;
      -webkit-app-region: drag;
      transition: background 0.25s ease, color 0.25s ease;
    }
    .lights {
      display: flex;
      align-items: center;
      gap: 8px;
      padding-left: 14px;
      -webkit-app-region: no-drag;
    }
    .light {
      width: 13px;
      height: 13px;
      border-radius: 50%;
      border: 1px solid rgba(0,0,0,0.25);
      padding: 0;
      cursor: pointer;
      transition: transform 0.12s ease, filter 0.12s ease;
      box-shadow: inset 0 1px 1px rgba(255,255,255,0.25), 0 1px 2px rgba(0,0,0,0.4);
    }
    .light:hover { transform: scale(1.2); filter: brightness(1.15); }
    .light:active { transform: scale(0.95); }
    .light.active { box-shadow: 0 0 0 2px var(--tb-active, #6d85ff), inset 0 1px 1px rgba(255,255,255,0.5), 0 1px 2px rgba(0,0,0,0.4); }
    .light-light { background: radial-gradient(circle at 32% 30%, #ffffff 0%, #d3d9e6 100%); }
    .light-dark { background: radial-gradient(circle at 32% 30%, #3a4254 0%, #1d2129 100%); }
    .title {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-left: 14px;
      font-weight: 600;
      color: var(--tb-text-strong);
      flex: 1;
      min-width: 0;
    }
    .title .mark {
      width: 20px;
      height: 20px;
      border-radius: 6px;
      background: linear-gradient(135deg, #4d6bfe 0%, #7c5cff 100%);
      color: #fff;
      display: grid;
      place-items: center;
      font-size: 9px;
      font-weight: 800;
    }
    .title .status {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #4a5468;
      flex: none;
      transition: background 0.3s ease;
    }
    .title .status.online { background: #28c840; box-shadow: 0 0 8px rgba(40, 200, 64, 0.7); }
    .right {
      -webkit-app-region: no-drag;
      display: flex;
      align-items: center;
      gap: 6px;
      padding-right: 4px;
    }
    .ctl-btn {
      border: 1px solid var(--tb-border, #2c3442);
      background: var(--tb-btn, #232936);
      color: var(--tb-text);
      border-radius: 8px;
      padding: 4px 11px;
      font-size: 11.5px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
      font-family: inherit;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .ctl-btn svg { opacity: 0.8; }
    .ctl-btn:hover { background: var(--tb-btn-hover, #2e3644); color: var(--tb-text-strong); border-color: #3c4658; }
    .ctl-btn.primary {
      background: linear-gradient(135deg, #4d6bfe 0%, #7c5cff 100%);
      border-color: transparent;
      color: #fff;
    }
    .ctl-btn.primary:hover { filter: brightness(1.1); color: #fff; }
    .win-ctrls { display: flex; align-items: stretch; margin-left: 2px; }
    .win-btn {
      width: 40px;
      height: 38px;
      border: none;
      background: transparent;
      color: var(--tb-text);
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: background 0.12s ease, color 0.12s ease;
      -webkit-app-region: no-drag;
    }
    .win-btn:hover { background: var(--tb-btn-hover, #2c3442); color: var(--tb-text-strong); }
    .win-btn.close:hover { background: #e81123; color: #fff; }
  </style>
</head>
<body>
  <div class="lights">
    <button class="light light-light" id="theme-light" title="浅色主题"></button>
    <button class="light light-dark" id="theme-dark" title="深色主题"></button>
  </div>
  <div class="title">
    <span class="mark">DS</span>
    <span>DeepSeek Harness</span>
    <span class="status" id="tb-status"></span>
  </div>
  <div class="right">
    <button class="ctl-btn" id="tb-plugins" title="插件商店">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
      插件
    </button>
    <button class="ctl-btn" id="tb-dash" title="会话成本仪表盘">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></svg>
      仪表盘
    </button>
    <button class="ctl-btn primary" id="tb-settings" title="设置">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      设置
    </button>
    <div class="win-ctrls">
      <button class="win-btn" id="win-min" title="最小化">
        <svg width="12" height="12" viewBox="0 0 12 12"><rect x="1" y="5.5" width="10" height="1" fill="currentColor"/></svg>
      </button>
      <button class="win-btn" id="win-max" title="最大化 / 还原">
        <svg width="12" height="12" viewBox="0 0 12 12" id="win-max-icon"><rect x="2.5" y="2.5" width="7" height="7" rx="0.5" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>
      </button>
      <button class="win-btn close" id="win-close" title="关闭（最小化到托盘）">
        <svg width="12" height="12" viewBox="0 0 12 12"><path d="M2.5 2.5l7 7M9.5 2.5l-7 7" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
      </button>
    </div>
  </div>
  <script src="theme.js"></script>
  <script src="titlebar.js"></script>
</body>
</html>
