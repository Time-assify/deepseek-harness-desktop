<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'" />
  <title>会话成本仪表盘</title>
  <link rel="stylesheet" href="common.css" />
  <style>
    body { padding: 22px 26px; }
    header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 20px; gap: 12px;
    }
    h1 {
      font-size: 18px;
      display: flex; align-items: center; gap: 10px;
    }
    h1 .mark {
      width: 30px; height: 30px; border-radius: 9px;
      background: var(--grad); color: #fff;
      display: grid; place-items: center;
      font-size: 12px; font-weight: 800;
      box-shadow: 0 3px 12px var(--accent-glow);
    }
    .sub { color: var(--text-3); font-size: 11.5px; margin-top: 3px; margin-left: 40px; font-family: var(--mono); }
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 12px;
      margin-bottom: 18px;
    }
    .stat {
      padding: 15px 17px;
      display: flex; flex-direction: column; gap: 7px;
      position: relative; overflow: hidden;
    }
    .stat .label {
      color: var(--text-2); font-size: 11.5px; font-weight: 600;
      display: flex; align-items: center; gap: 6px;
    }
    .stat .value {
      font-size: 21px; font-weight: 700; font-variant-numeric: tabular-nums;
      letter-spacing: -0.3px;
    }
    .stat .bar {
      position: absolute; left: 0; right: 0; bottom: 0; height: 3px;
      background: var(--border); overflow: hidden;
    }
    .stat .bar i {
      display: block; height: 100%; width: 0%;
      background: var(--grad); border-radius: 0 3px 3px 0;
      transition: width 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    .stat.hero {
      grid-column: span 2;
      background:
        linear-gradient(135deg, rgba(77,107,254,0.06), rgba(124,92,255,0.1)),
        var(--surface);
    }
    .stat.hero .value { font-size: 27px; }
    .table-wrap {
      overflow: auto;
      max-height: calc(100vh - 360px);
      min-height: 180px;
    }
    table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
    th {
      text-align: left; padding: 11px 15px; color: var(--text-2); font-weight: 650;
      border-bottom: 1px solid var(--border); background: var(--surface-2);
      position: sticky; top: 0; z-index: 2; font-size: 11.5px;
    }
    td { padding: 10px 15px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    tbody tr { transition: background 0.12s ease; }
    tbody tr:hover { background: var(--surface-2); }
    tbody tr:last-child td { border-bottom: none; }
    td.num { font-variant-numeric: tabular-nums; color: var(--text-2); }
    .cost { font-weight: 700; color: var(--warning); }
    .title-cell { max-width: 300px; }
    .title-cell .t { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .title-cell .c {
      color: var(--text-3); font-size: 10.5px; font-family: var(--mono);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 2px;
    }
    .model-chip {
      display: inline-flex; align-items: center; gap: 5px;
      font-family: var(--mono); font-size: 11px;
      background: var(--accent-soft); color: var(--accent);
      border-radius: 6px; padding: 2px 8px; max-width: 220px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .empty { padding: 46px; text-align: center; color: var(--text-3); }
    .hint { margin-top: 14px; }
    .error { color: var(--danger); font-size: 13px; padding: 34px; text-align: center; }
  </style>
</head>
<body>
  <header>
    <div>
      <h1><span class="mark">DS</span>会话成本仪表盘</h1>
      <div class="sub" id="dataDir"></div>
    </div>
    <button id="refresh" class="primary">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
      刷新
    </button>
  </header>

  <div class="cards" id="cards"></div>
  <div class="card table-wrap">
    <table>
      <thead>
        <tr>
          <th>会话</th><th>模型</th><th>最近活动</th><th>输入</th><th>缓存读</th><th>输出</th><th>步骤</th><th>成本估算</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
    <div class="empty" id="empty" style="display:none">暂无会话数据</div>
  </div>
  <div class="hint">
    成本按官方价格估算：deepseek-chat 输入 ¥2 / 缓存读 ¥0.5 / 输出 ¥8（每百万 token）；deepseek-reasoner 输入 ¥4 / 缓存读 ¥1 / 输出 ¥16。
    无法识别的模型按 deepseek-chat 价格估算，仅供参考。
  </div>
  <script src="dashboard.js"></script>
</body>
</html>
